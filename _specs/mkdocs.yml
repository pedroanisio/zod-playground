site_name: Principles Specifications
site_description: Generated schema reference and authoring docs
site_url: ""
docs_dir: ..
site_dir: ../../site
exclude_docs: |
  CLAUDE.md
  _specs/**
  generated/schemas/README.md
not_in_nav: |
  generated/schemas/*.md
  !generated/schemas/index.md
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
plugins:
  - search
  - copy-to-llm
markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Generated Schema Reference: generated/schemas/index.md
