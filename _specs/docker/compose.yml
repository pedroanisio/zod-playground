services:
  docs-build:
    build:
      context: ../..
      dockerfile: _specs/docker/Dockerfile
    image: principles-docs:local-specs
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: build

  docs-serve:
    build:
      context: ../..
      dockerfile: _specs/docker/Dockerfile
    image: principles-docs:local-specs
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    command: serve
    ports:
      - "${DOCS_PORT:-8000}:8000"
